set_product:
  name: Add or update approved product
  description: Register an approved product with validated unique matching names/aliases. Changes apply to future
    matches; saved order snapshots remain unchanged. Shopping-list adds only queue orders.
  fields:
    name:
      required: true
      selector:
        text: null
      name: Product name
      description: Exact Shopping List name to match; case and extra spaces are ignored.
    aliases:
      selector:
        object: null
      name: Matching aliases
      description: Additional exact names; these do not change the ordered quantity.
    retailer:
      required: true
      selector:
        select:
          options:
          - zinc
          - kroger
          - other
    product_id:
      required: true
      selector:
        text: null
      name: Product URL or identifier
      description: Zinc requires the complete HTTPS retailer product URL. Check the variant and pack size.
    substitutes:
      description: Up to two ranked HTTPS fallback product URLs. Zinc only.
      selector:
        object: null
    quantity:
      selector:
        number:
          min: 1
          max: 20
      name: Retailer units
      description: Fixed units per matching list entry; Shopping List text is not parsed for quantity.
    max_price:
      selector:
        number:
          min: 0.01
          max: 10000
          step: 0.01
      name: Product ceiling contribution (USD)
      description: Allowance for configured units plus tax and shipping. Order contributions are summed into one
        order cap, not enforced separately per line.
    cooldown_hours:
      selector:
        number:
          min: 1
          max: 8760
      name: Repeat-request cooldown (hours)
      description: Pending/uncertain purchases block repeats. Confirmed delivery or recorded receipt anchors the
        cooldown; 168 hours = 7 days.
    enabled:
      selector:
        boolean: null
remove_product:
  name: Remove approved product
  fields:
    name:
      required: true
      selector:
        text: null
approve_order:
  name: Mark Cart item approved locally
  description: Marks an unbatched queued line approved locally. Approval never submits a Sandbox or live purchase.
  fields:
    order_id:
      required: true
      selector:
        text: null
cancel_order:
  name: Remove queued Cart item locally
  description: Cancels an unbatched queued line locally. Cannot cancel a submitted retailer order. For prepared
    lines, manage the order instead.
  fields:
    order_id:
      required: true
      selector:
        text: null
submit_zinc:
  name: Submit Zinc order
  description: Sends a queued Zinc order to the API. Requires SANDBOX for test keys or PLACE LIVE ORDER for live
    keys. This action can spend real money if live is enabled.
  fields:
    order_id:
      required: true
      selector:
        text: null
      description: Local unbatched Reorder order ID, not a saved order ID or Zinc order ID. Use submit_batch_zinc
        for prepared orders.
    confirmation:
      required: true
      selector:
        text: null
      description: 'Exact phrase: SANDBOX for a test key; PLACE LIVE ORDER for a live key with live purchasing enabled.'
refresh_zinc:
  name: Refresh Zinc order
  description: Fetches status for a legacy standalone order. Does not submit or cancel a purchase. Standalone orders
    are not included in automatic batch tracking or delivery-to-list completion. Requires a valid matching-environment
    key, not live purchasing enablement or shipping details.
  fields:
    order_id:
      required: true
      selector:
        text: null
queue_next_substitution:
  name: Queue next approved substitution
  description: Only works after a Zinc order is confirmed out_of_stock. Creates a new queued order, never automatically
    buys.
  fields:
    order_id:
      required: true
      selector:
        text: null
preview_batch:
  name: Preview Zinc order
  description: Previews eligible products and spending ceiling without purchases. Supports an optional preview response.
prepare_batch:
  name: Prepare Zinc order
  description: Saves up to 10 unbatched product lines for review. Returns the saved order when a response is requested;
    also available in Prepared orderes sensor attributes. Notification failure does not undo creation.
  fields:
    max_items:
      selector:
        number:
          min: 1
          max: 10
          mode: box
submit_batch_zinc:
  name: Submit Zinc order
  description: Submits a ready saved order once using the current credentials and its combined USD ceiling, including
    tax and shipping. Requires SANDBOX for a test key, or a live key plus enabled live purchasing and PLACE LIVE
    ORDER. Live submission can spend real money. An uncertain attempt must be reconciled in Zinc, not submitted
    as a new order.
  fields:
    batch_id:
      required: true
      selector:
        text: null
      name: Saved order ID
      description: Local Reorder order ID shown in Orders, not the Zinc order ID.
    confirmation:
      required: true
      description: SANDBOX for test credentials or PLACE LIVE ORDER for live credentials.
      selector:
        text: null
refresh_batch_zinc:
  name: Refresh Zinc order status
  description: Retrieves status without making a purchase. May check off original Shopping List IDs after confirmed
    item delivery when automatic completion is enabled. Placement alone never completes the list. Tracking also
    runs every 15 minutes for unresolved orders; supports an optional saved response. Requires a valid matching-environment
    key, not live purchasing enablement or shipping details.
  fields:
    batch_id:
      required: true
      selector:
        text: null
      name: Saved order ID
      description: Local Reorder order ID shown in Orders, not the Zinc order ID.
review_batch:
  name: Review saved order
  description: Shows the order's saved product URLs, quantities, status, and price ceilings without contacting Zinc.
    Supports an optional response.
  fields:
    batch_id:
      required: true
      selector:
        text: null
      name: Saved order ID
      description: Local Reorder order ID shown in Orders, not the Zinc order ID.
cancel_batch:
  name: Cancel unsubmitted order
  description: Cancels a ready local batch and all its queued orders. Does not cancel retailer purchases or return
    orders to the queue. Attempted submissions cannot be canceled here. Supports an optional response.
  fields:
    batch_id:
      required: true
      selector:
        text: null
      name: Saved order ID
      description: Local Reorder order ID shown in Orders, not the Zinc order ID.
