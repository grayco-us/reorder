name: Validate Reorder
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run sidebar frontend tests
        run: node tests/test_panel.mjs
      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify Home Assistant frontend test dependency
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          import homeassistant
          import hass_frontend
          from importlib.metadata import version
          assert sys.prefix != sys.base_prefix, 'CI tests must run in the virtual environment'
          manifest = json.loads((Path(homeassistant.__file__).parent / 'components/frontend/manifest.json').read_text())
          assert f"home-assistant-frontend=={version('home-assistant-frontend')}" in manifest['requirements']
          assert Path(hass_frontend.where()).is_dir()
          print('Home Assistant frontend dependency is installed and matches the test baseline')
          PY
      - name: Run batch regression tests (mocked Zinc transport)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Python source
        run: python -m compileall -q custom_components/reorder tests
      - name: Check JSON files
        run: python -c 'import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path("custom_components/reorder").glob("*.json")]; json.loads(pathlib.Path("hacs.json").read_text())'
      - name: Check manifest and repository layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('custom_components/reorder/manifest.json').read_text())
          assert d['domain'] == 'reorder'
          assert d['config_flow'] is True
          assert d['version']
          assert list(Path('custom_components').iterdir()) == [Path('custom_components/reorder')]
          PY
